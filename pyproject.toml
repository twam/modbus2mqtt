[project]
name = "modbus2mqtt"
version = "0.0.1"
description = ""
authors = [
	{ name = "Tobias Müller", email = "Tobias_Mueller@twam.info" }
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
	"PyYAML>=6.0,<7",
	"paho-mqtt>=1.0,<2", # asyncio-mqtt isn't working with 2, yet
	"aiomqtt>=2.0.0,<3",
	"pymodbus>=3.11.0,<3.12",
	"construct>=2.10.70,<3",
]

[project.scripts]
modbus2mqtt = 'modbus2mqtt.modbus2mqtt:main'

[dependency-groups]
dev= [
	"ruff",
	"pytest",
	"pytest-mock",
	"pytest-asyncio",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 320

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "RUF"]
ignore = ["E501"]


